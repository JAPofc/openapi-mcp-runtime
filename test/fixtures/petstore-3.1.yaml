openapi: 3.1.0
info:
  title: Status API
  version: 2.0.0
servers:
  - url: http://127.0.0.1:4010
security:
  - oauth2: [read:status]
paths:
  /status/{service}:
    get:
      operationId: getStatus
      summary: Get service status
      parameters:
        - name: service
          in: path
          required: true
          schema:
            type: string
        - name: detail
          in: query
          schema:
            type: string
            enum: [full, short]
      responses:
        "200":
          description: ok
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://127.0.0.1:4010/oauth/token
          scopes:
            read:status: Read status
